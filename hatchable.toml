name = "ULTRON"

[[config]]
name = "ultron_allow_paid_ai_fallback"
type = "string"
label = "Allow paid AI fallback"
help = "Set to true only when you explicitly approve paid or billing-unknown AI fallback. Leave blank or false to keep fallback disabled."
maxlength = 5

[[secret]]
name = "NVIDIA_API_KEY"
required = false
description = "NVIDIA API key (build.nvidia.com). ULTRON uses it first for conversation, with Llama 3.3 70B."

[[secret]]
name = "GROQ_API_KEY"
required = false
description = "Groq API key (console.groq.com). Lets ULTRON hear you with Whisper, including in the iPhone Home Screen app."

[[secret]]
name = "CLOUDFLARE_ACCOUNT_ID"
required = false
description = "Cloudflare Account ID (dash.cloudflare.com, right sidebar of the account home). Used for free Workers AI hearing and voice."

[[secret]]
name = "CLOUDFLARE_API_TOKEN"
required = false
description = "Cloudflare API token with Workers AI permission (dash.cloudflare.com/profile/api-tokens). Stay on the Workers Free plan so usage is capped at the free daily allowance."

[[config]]
name = "cloudflare_account_id"
type = "string"
label = "Cloudflare Account ID"
help = "32-character ID from dash.cloudflare.com (not secret). Pairs with the Cloudflare API token secret for free Workers AI hearing and voice."
maxlength = 64

[[secret]]
name = "OPENAI_API_KEY"
required = false
description = "Optional OpenAI key. Enables Whisper hearing and ULTRON's premium deep spoken voice."

[[secret]]
name = "TAVILY_API_KEY"
required = false
description = "Optional Tavily search key for ULTRON web research. Tavily currently includes a free monthly credit allowance."

[ai]
required = false
description = "Optional conversational intelligence. ULTRON does not call a model until its owner explicitly enables the AI brain in the app."

[[api]]
name = "google_calendar"
auth = "oauth2"
base_url = "https://www.googleapis.com"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
scopes = ["https://www.googleapis.com/auth/calendar.readonly", "https://www.googleapis.com/auth/calendar.events.owned"]
required = false
description = "ULTRON reads your calendar and creates events only after you approve a proposed event."

[[api]]
name = "gmail_read"
auth = "oauth2"
base_url = "https://gmail.googleapis.com"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
scopes = ["https://www.googleapis.com/auth/gmail.readonly"]
required = false
description = "Read-only Gmail access for inbox summaries and preparation."

[[api]]
name = "gmail_compose"
auth = "oauth2"
base_url = "https://gmail.googleapis.com"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
scopes = ["https://www.googleapis.com/auth/gmail.compose"]
required = false
description = "Create Gmail drafts after you approve them. ULTRON never sends email automatically."

[[cron]]
path = "/api/ultron/jobs/daily-brief"
schedule = "0 * * * *"

[[cron]]
path = "/api/ultron/jobs/research-pipeline"
schedule = "0 * * * *"

[[cron]]
path = "/api/ultron/jobs/agent-runner"
schedule = "0 * * * *"

[[cron]]
path = "/api/ultron/jobs/self-test"
schedule = "0 5 * * *"